# SentinelAI - Render Blueprint (Native Python Runtime)
# Deploys a single full-stack web service (FastAPI backend + built React frontend)
# on the same origin. Uses Render's native Python runtime (free-plan compatible,
# no Docker required). The backend serves the frontend static files at /.
#
# To deploy: push this repo to GitHub, then use "New Blueprint" in Render
# and connect the repo. Render will read this file.
#
# The repo root is the deployment root (no rootDir), so ai_engine/ and dataset/
# remain accessible. build.sh (repo root) installs backend deps and builds the
# frontend. The start command runs uvicorn from the backend/ directory.

services:
  - type: web
    name: sentinelai
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./sentinelai.db
      - key: REDIS_URL
        value: redis://localhost:6379/0
